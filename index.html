<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#05040a">
<meta name="description" content="What else are you gonna do on a Saturday?">
<meta property="og:title" content="THE LAST HOOLIGAN">
<meta property="og:description" content="What else are you gonna do on a Saturday?">

<title>THE LAST HOOLIGAN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23120c14'/%3E%3Crect x='1' y='1' width='14' height='14' fill='%23c8102e'/%3E%3Crect x='3' y='3' width='2' height='10' fill='%23f4f1e8'/%3E%3Crect x='11' y='3' width='2' height='10' fill='%23f4f1e8'/%3E%3Crect x='5' y='7' width='6' height='2' fill='%23f4f1e8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap">
<style>
  html,body{margin:0;height:100%;background:#05040a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;box-shadow:0 0 80px #000,0 0 0 2px #121214}
  #stage canvas{position:absolute;left:0;top:0}
  #gl{display:none;image-rendering:auto}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;outline:none}
  canvas.hd{image-rendering:auto}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    font:600 15px/1.4 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:4px;color:#f4f1e8;
    background:radial-gradient(ellipse at 50% 40%,#221c08 0%,#0a0a08 55%,#050505 100%);pointer-events:none}
  #loading b{font:400 44px/1 Anton,Impact,sans-serif;letter-spacing:2px;color:#f2c811;text-shadow:0 0 24px rgba(242,200,17,.45)}
  #loading i{font-style:normal;color:#8e8b82;animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="game" tabindex="0"></canvas></div>
<div id="loading"><b>THE LAST HOOLIGAN</b><i>LOADING...</i></div>
<noscript><p style="color:#fff;font-family:monospace">THE LAST HOOLIGAN needs JavaScript (and a local web server).</p></noscript>
<!-- Three.js for the 3D renderer (?renderer=3d). Only loaded when 3D is enabled. Exact version, no build step. -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
<script type="module" src="src/main.js"></script>
<script>
  // If the modules fail to load (no local server, flaky connection), say so instead of "LOADING..." forever.
  setTimeout(function () {
    var el = document.getElementById('loading');
    if (el) el.querySelector('i').textContent = 'STILL LOADING... PRESS F5 TO RETRY (SERVE OVER HTTP, NOT FILE://)';
  }, 9000);
</script>
</body>
</html>
